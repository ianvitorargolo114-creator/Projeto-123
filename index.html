<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Gastos</title>
    <!-- Vinculação do arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>💰 Controle de Gastos Mensais</h1>
        </header>

        <!-- ALERTA DE LIMITE (RN06) -->
        <div id="limit-alert" class="alert-box"></div>

        <!-- DASHBOARD (RF04, RF05) -->
        <section class="card dashboard">
            <div class="metric">
                <span class="metric-label">Limite Mensal</span>
                <div class="inline-form" style="margin-top: 5px;">
                    <input type="number" id="input-limit" min="0" step="0.01" value="1000.00">
                </div>
            </div>
            <div class="metric">
                <span class="metric-label">Total Gasto</span>
                <span class="metric-value" id="metric-total">R$ 0,00</span>
            </div>
            <div class="metric">
                <span class="metric-label">Saldo Disponível</span>
                <span class="metric-value" id="metric-available">R$ 0,00</span>
            </div>
        </section>

        <!-- FORMULÁRIO DE CADASTRO (RF01, RF06, RN01 a RN04) -->
        <section class="card">
            <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Cadastrar Novo Gasto</h2>
            <form id="expense-form" novalidate>
                <div class="form-group">
                    <label for="desc">Descrição</label>
                    <input type="text" id="desc" placeholder="Ex: Almoço">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Valor (R$)</label>
                        <input type="number" id="amount" min="0.01" step="0.01" placeholder="0,00">
                    </div>
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category">
                            <option value="">Selecione...</option>
                            <option value="Alimentação">Alimentação</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Educação">Educação</option>
                            <option value="Compras">Compras</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">Data</label>
                    <input type="date" id="date">
                </div>

                <button type="submit" class="btn btn-primary">Adicionar Gasto</button>
            </form>
        </section>

        <!-- HISTÓRICO DE GASTOS (RF02, RF03) -->
        <section class="card">
            <h2 style="font-size: 1.2rem;">Histórico de Gastos</h2>
            <ul id="expense-list-container" class="expense-list">
                <!-- Inserido dinamicamente via JS -->
            </ul>
        </section>
    </div>

    <!-- Vinculação do arquivo JavaScript externo -->
    <script src="scripts.js"></script>
</body>
</html>
